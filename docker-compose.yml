services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      LICHESS_CLIENT_ID: ${LICHESS_CLIENT_ID:-pgn-parser-dev}
      LICHESS_REDIRECT_URI: ${LICHESS_REDIRECT_URI:-http://localhost/api/auth/lichess/callback}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
openapi: 3.0.3
info:
  title: PGN Parser API
  version: 1.0.0

paths:
  /pgn/separated:
    post:
      summary: Convert a PGN into separated PGN
      operationId: convertPgnToSeparated
      security:
        - basicAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PgnRequest'
      responses:
        '200':
          description: PGN converted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeparatedPgnResponse'
  /pgn/combined:
    post:
      summary: Convert a PGN into combined PGN
      operationId: convertPgnToCombined
      security:
        - basicAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PgnRequest'
      responses:
        '200':
          description: PGN converted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CombinedPgnResponse'
  /study:
    post:
      summary: Create a Lichess study with the provided PGN
      operationId: createStudyAndUploadPgn
      security:
        - basicAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLichessStudyRequest'
      responses:
        '200':
          description: Study created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateLichessStudyResponse'

  /auth/lichess/login:
    get:
      tags: [ auth ]
      summary: Start the Lichess OAuth (Authorization Code + PKCE) flow
      operationId: lichessLogin
      responses:
        '302':
          description: Redirect to the Lichess authorization endpoint
          headers:
            Location:
              schema: { type: string }
  /auth/lichess/callback:
    get:
      tags: [ auth ]
      summary: OAuth redirect URI; exchanges code for token and stores it in the session
      operationId: lichessCallback
      parameters:
        - in: query
          name: code
          schema: { type: string }
        - in: query
          name: state
          schema: { type: string }
        - in: query
          name: error
          schema: { type: string }
      responses:
        '302':
          description: Redirect back to the configured frontend URL
          headers:
            Location:
              schema: { type: string }
  /auth/logout:
    post:
      tags: [ auth ]
      summary: Invalidate the Lichess session and revoke the token at Lichess
      operationId: logout
      responses:
        '204':
          description: Logged out
  /auth/me:
    get:
      tags: [ auth ]
      summary: Current Lichess authentication state
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatusResponse'


components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

  schemas:
    PgnRequest:
      type: object
      properties:
        pgn:
          type: string
          example: "1. e4 e5 2. Nf3 (2.Nc3) 2...Nc6"
    SeparatedPgnResponse:
      type: object
      properties:
        variations:
          type: array
          items:
            type: string
      example:
        variations:
          - "1. e4 e5 2. Nf3 Nc6"
          - "1. e4 e5 2. Nc3"
    CombinedPgnResponse:
      type: object
      properties:
        combined:
          type: string
          example: "1. e5 e5 2. Nf3 Nc6\n\n1.e4 e5 2. Nc3"
    CreateLichessStudyRequest:
      type: object
      properties:
        pgn:
          type: string
        studyName:
          type: string
        color:
          type: string
          enum:
            - white
            - black

    CreateLichessStudyResponse:
      type: object
      properties:
        studyId:
          type: string
        url:
          type: string

    AuthStatusResponse:
      type: object
      required: [ authenticated ]
      properties:
        authenticated:
          type: boolean
        username:
          type: string
spring.application.name=pgn-parser-for-java
spring.security.user.name=alpa
spring.security.user.password=secret123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Lichess OAuth (Authorization Code + PKCE). Lichess is a public client; no secret.
lichess.oauth.client-id=${LICHESS_CLIENT_ID:pgn-parser-dev}
lichess.oauth.authorize-uri=https://lichess.org/oauth
lichess.oauth.token-uri=https://lichess.org/api/token
lichess.oauth.revoke-uri=https://lichess.org/api/token
lichess.oauth.account-uri=https://lichess.org/api/account
lichess.oauth.redirect-uri=${LICHESS_REDIRECT_URI:http://localhost:8080/api/auth/lichess/callback}
lichess.oauth.scopes=study:read,study:write

app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

spring.application.name=pgn-parser-for-java
spring.security.user.name=alpa
spring.security.user.password=secret123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# HTTP response compression. JSON PGN responses (especially combined PGNs with
# many variations) compress 5-10x.
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

# Cap request bodies to mitigate DoS via huge PGN uploads. ~5 MB is well above any
# realistic single-game PGN.
server.tomcat.max-http-form-post-size=5MB
server.tomcat.max-swallow-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.servlet.multipart.max-file-size=5MB
# Cap PGN string length applied at the controller layer.
app.pgn.max-length=5000000

# Lichess OAuth (Authorization Code + PKCE). Lichess is a public client; no secret.
lichess.oauth.client-id=${LICHESS_CLIENT_ID:pgn-parser-dev}
lichess.oauth.authorize-uri=https://lichess.org/oauth
lichess.oauth.token-uri=https://lichess.org/api/token
lichess.oauth.revoke-uri=https://lichess.org/api/token
lichess.oauth.account-uri=https://lichess.org/api/account
lichess.oauth.redirect-uri=${LICHESS_REDIRECT_URI:http://localhost:5173/api/auth/lichess/callback}
lichess.oauth.scopes=study:read,study:write

app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
